name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge,defaults
          channel-priority: strict
          activate-environment: transform_vectors_ci

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y numpy pyproj cartopy matplotlib pytest ruff
          pip install -e .

      - name: Lint with ruff
        shell: bash -el {0}
        run: ruff check .

      - name: Run tests (excluding performance)
        shell: bash -el {0}
        run: pytest tests/ --ignore=tests/test_performance.py -v

  performance:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # runs on push to main only, not on every PR
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge,defaults
          activate-environment: transform_vectors_perf

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y numpy pyproj pytest
          pip install -e .

      - name: Run performance benchmarks
        shell: bash -el {0}
        run: pytest tests/test_performance.py -v -s