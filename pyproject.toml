[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transform-vectors"
version = "0.1.0"
description = "Transform vector fields between coordinate reference systems using pyproj — a cartopy-free alternative to cartopy.crs.transform_vectors with rotated pole support"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["pyproj", "projection", "vector", "CRS", "rotated pole",
            "meteorology", "oceanography", "GIS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyproj>=3.4",
    "numpy>=1.21",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "cartopy",          # only needed for reference comparison in tests
]
plot = [
    "matplotlib>=3.5",
    "cartopy",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "cartopy",
    "ruff",             # matches pyproj's linter
]

[project.urls]
Homepage   = "https://github.com/lenny-frno/transform_vectors"
Issues     = "https://github.com/lenny-frno/transform_vectors/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["transform_vectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]